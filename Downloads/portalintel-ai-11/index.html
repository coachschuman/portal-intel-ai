
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PortalIntel AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Stripe Buy Button Script -->
    <script async src="https://js.stripe.com/v3/buy-button.js"></script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0f172a; /* Slate 900 */
        color: #e2e8f0; /* Slate 200 */
      }
      
      /* CRITICAL FIX: Aggressive override for browser autofill (Screenshot fix) */
      input:-webkit-autofill,
      input:-webkit-autofill:hover, 
      input:-webkit-autofill:focus, 
      input:-webkit-autofill:active {
        -webkit-box-shadow: 0 0 0 1000px #020617 inset !important; /* Forces dark background */
        -webkit-text-fill-color: #f8fafc !important; /* Forces light text */
        caret-color: white !important;
        transition: background-color 5000s ease-in-out 0s;
      }

      /* Custom scrollbar for chat */
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }

      /* Advanced Scouting Highlight Animation */
      @keyframes glow-pulse {
        0%, 100% { 
          box-shadow: 0 0 15px rgba(234, 179, 8, 0.1);
          transform: scale(1.02);
          border-color: rgba(234, 179, 8, 0.4);
        }
        50% { 
          box-shadow: 0 0 35px rgba(234, 179, 8, 0.4);
          transform: scale(1.035);
          border-color: rgba(234, 179, 8, 0.8);
        }
      }
      .animate-glow-pulse {
        animation: glow-pulse 2.5s infinite ease-in-out;
      }

      @keyframes progress-indeterminate {
        0% { transform: translateX(-100%) scaleX(0.2); }
        50% { transform: translateX(0) scaleX(0.5); }
        100% { transform: translateX(100%) scaleX(0.2); }
      }
      .animate-progress-indeterminate {
        animation: progress-indeterminate 1.5s infinite linear;
      }

      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        75% { transform: translateX(5px); }
      }
      .animate-shake {
        animation: shake 0.2s ease-in-out 0s 2;
      }
    </style>
